<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direction Browser — RUNE 01</title>
  <link rel="stylesheet" href="browser.css" />
</head>
<body>
  <main class="browser-shell">
    <header class="browser-topbar">
      <div class="browser-brand"><span>DDG</span><strong>RUNE 01 / DIRECTION BROWSER</strong></div>
      <div class="view-tabs" role="tablist" aria-label="Reference screen"><button class="is-active" data-view="hero" role="tab" aria-selected="true">Hero</button><button data-view="next" role="tab" aria-selected="false">Section 02</button></div>
      <div class="browser-counter"><span id="current-index">01</span><i></i><span>10</span></div>
    </header>
    <aside class="direction-list" aria-label="Design directions"></aside>
    <section class="reference-stage" aria-live="polite"><img id="reference-image" src="screenshots/01-quiet-monolith-hero.png" alt="Selected code-rendered design direction" /></section>
    <footer class="browser-meta">
      <div><p>SELECTED DIRECTION</p><h1 id="direction-name">Quiet Monolith</h1></div>
      <div class="browser-idea"><p>IDEA / TRADEOFF</p><span id="direction-idea">Make the object the only bright presence; intentionally withhold room context until section two.</span></div>
      <div class="browser-proof"><p>REFERENCE CONTRACT</p><span>1440 × 900 / Browser render</span><span>Exact local fonts + media</span></div>
      <div class="browser-actions"><button id="previous" aria-label="Previous direction">←</button><button id="next" aria-label="Next direction">→</button></div>
    </footer>
  </main>
  <script src="browser.js"></script>
</body>
</html>
